[project]
name = "vietnamese-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pypdf>=5,<8", "httpx>=0.28,<1", "numpy>=2,<3",
  "pillow>=13,<14", "pypdfium2>=5,<6", "tesserocr>=2.13,<3; sys_platform == 'win32'",
  "sentence-transformers==6.3.0"
]

[project.optional-dependencies]
neural = ["sentence-transformers==6.3.0"]
dev = ["pytest>=8,<10", "reportlab>=4,<6", "pyyaml>=6,<7", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
