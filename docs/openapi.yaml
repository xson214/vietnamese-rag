      - document_id
      - document_version
      - filename
      - text
      - source_spans
      - rank
      - scores
      title: SearchHit
    SearchRequest:
      properties:
        document_ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          uniqueItems: true
          title: Document Ids
        index_version:
          type: string
          maxLength: 200
          minLength: 1
          title: Index Version
