components:
  schemas:
    ChatRequest:
      properties:
        document_ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          uniqueItems: true
          title: Document Ids
        index_version:
          type: string
          maxLength: 200
          minLength: 1
          title: Index Version
        retrieval_config:
          $ref: '#/components/schemas/RetrievalConfig'
        question:
          type: string
          maxLength: 4000
          minLength: 1
          title: Question
        generation_config:
          $ref: '#/components/schemas/GenerationConfig'
      additionalProperties: false
      type: object
      required:
      - question
      title: ChatRequest
    ChatResponse:
      allOf:
      - if:
          properties:
            status:
              const: answered
        then:
          properties:
            citations:
              minItems: 1
        else:
          properties:
            citations:
              maxItems: 0
      properties:
        request_id:
          type: string
          title: Request Id
        status:
          type: string
          enum:
          - answered
          - insufficient_evidence
          title: Status
        answer:
          type: string
          title: Answer
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          title: Citations
        confidence:
          type: 'null'
          title: Confidence
        retrieval_trace:
          $ref: '#/components/schemas/RetrievalTrace'
      type: object
      required:
      - request_id
      - status
      - answer
      - citations
      - retrieval_trace
      title: ChatResponse
    Citation:
      properties:
        source_id:
          type: string
          title: Source Id
        document_id:
          type: string
          title: Document Id
        document_version:
          type: integer
          title: Document Version
        filename:
          type: string
          title: Filename
        page_number:
          type: integer
          title: Page Number
        quote:
          type: string
          title: Quote
        source_span:
          $ref: '#/components/schemas/CitationOffset'
        source_url:
          type: string
          title: Source Url
      type: object
      required:
      - source_id
      - document_id
      - document_version
      - filename
      - page_number
      - quote
      - source_span
      - source_url
      title: Citation
    CitationOffset:
      properties:
        start_offset:
          type: integer
          title: Start Offset
        end_offset:
          type: integer
          title: End Offset
      type: object
      required:
      - start_offset
      - end_offset
      title: CitationOffset
    DeleteResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        document_id:
          type: string
          title: Document Id
        status:
          type: string
          const: deleting
          title: Status
        job_id:
          type: string
          title: Job Id
      type: object
      required:
      - request_id
      - document_id
      - status
      - job_id
      title: DeleteResponse
    Document:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: integer
          title: Document Version
        filename:
          type: string
          title: Filename
        mime_type:
          type: string
          title: Mime Type
        size_bytes:
          type: integer
          title: Size Bytes
        status:
          type: string
          enum:
          - queued
          - processing
          - ready
          - failed
          - deleting
          - delete_failed
          title: Status
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
        available_index_versions:
          items:
            type: string
          type: array
          title: Available Index Versions
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - document_id
      - document_version
      - filename
      - mime_type
      - size_bytes
      - status
      - page_count
      - job_id
      - available_index_versions
      - source_url
      - error
      - created_at
      - updated_at
      title: Document
    DocumentListResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        items:
          items:
            $ref: '#/components/schemas/Document'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - request_id
      - items
      - next_cursor
      title: DocumentListResponse
    DocumentResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        document:
          $ref: '#/components/schemas/Document'
      type: object
      required:
      - request_id
      - document
      title: DocumentResponse
    ErrorDetail:
      properties:
        field:
          type: string
          title: Field
        reason:
          type: string
          title: Reason
      type: object
      required:
      - field
      - reason
      title: ErrorDetail
    ErrorInfo:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          default: []
      type: object
      required:
      - code
      - message
      - retryable
      title: ErrorInfo
    ErrorResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        status:
          type: string
          const: error
          title: Status
          default: error
        error:
          $ref: '#/components/schemas/ErrorInfo'
      type: object
      required:
      - request_id
      - error
      title: ErrorResponse
    GenerationConfig:
      properties:
        base_url:
          type: string
          maxLength: 2048
          title: Base Url
          default: ''
        api_key:
          type: string
          maxLength: 8192
          format: password
          title: Api Key
          writeOnly: true
        backend:
          type: string
          enum:
          - extractive
          - api
          title: Backend
          default: extractive
        model:
          type: string
          maxLength: 200
          title: Model
          default: ''
      additionalProperties: false
      type: object
      title: GenerationConfig
    HealthResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
          title: Status
        checked_at:
          type: string
          title: Checked At
        active_index_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Index Version
        components:
          additionalProperties:
            type: string
          type: object
          title: Components
        modes:
          additionalProperties:
            type: string
          type: object
          title: Modes
      type: object
      required:
      - request_id
      - status
      - checked_at
      - active_index_version
      - components
      - modes
      title: HealthResponse
    ModelsRequest:
      properties:
        base_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Base Url
        api_key:
          type: string
          maxLength: 8192
          format: password
          title: Api Key
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - base_url
      title: ModelsRequest
    ModelsResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        models:
          items:
            type: string
          type: array
          title: Models
      type: object
      required:
      - request_id
      - models
      title: ModelsResponse
    RetrievalConfig:
      not:
        properties:
          dense:
            const: false
          bm25:
            const: false
        required:
        - dense
        - bm25
      properties:
        dense:
          type: boolean
          title: Dense
          default: true
        bm25:
          type: boolean
          title: Bm25
          default: true
        reranking:
          type: boolean
          title: Reranking
          default: true
        top_k:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Top K
          default: 5
      additionalProperties: false
      type: object
      title: RetrievalConfig
    RetrievalTrace:
      properties:
        resolved_index_version:
          type: string
          title: Resolved Index Version
        corpus_snapshot_id:
          type: string
          title: Corpus Snapshot Id
        embedding_model_version:
          type: string
          title: Embedding Model Version
        chunking_config_id:
          type: string
          title: Chunking Config Id
        effective_config:
          $ref: '#/components/schemas/RetrievalConfig'
        candidate_count:
          type: integer
          title: Candidate Count
        reranked_count:
          type: integer
          title: Reranked Count
        returned_count:
          type: integer
          title: Returned Count
        context_chunk_count:
          type: integer
          title: Context Chunk Count
      additionalProperties: true
      type: object
      required:
      - resolved_index_version
      - corpus_snapshot_id
      - embedding_model_version
      - chunking_config_id
      - effective_config
      - candidate_count
      - reranked_count
      - returned_count
      - context_chunk_count
      title: RetrievalTrace
    Scores:
      properties:
        dense:
          anyOf:
          - type: number
          - type: 'null'
          title: Dense
        bm25:
          anyOf:
          - type: number
          - type: 'null'
          title: Bm25
        fusion:
          anyOf:
          - type: number
          - type: 'null'
          title: Fusion
        rerank:
          anyOf:
          - type: number
          - type: 'null'
          title: Rerank
      type: object
      title: Scores
    SearchHit:
      properties:
        chunk_id:
          type: string
          title: Chunk Id
        document_id:
          type: string
          title: Document Id
        document_version:
          type: integer
          title: Document Version
        filename:
          type: string
          title: Filename
        text:
          type: string
          title: Text
        source_spans:
          items:
            $ref: '#/components/schemas/SourceSpan'
          type: array
          title: Source Spans
        rank:
          type: integer
          title: Rank
        scores:
          $ref: '#/components/schemas/Scores'
      type: object
      required:
