services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_NEURAL: ${INSTALL_NEURAL:-true}
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      RERANKER_BACKEND: ${RERANKER_BACKEND:-lexical}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_REVISION: ${RERANKER_REVISION:-main}
      GENERATION_BACKEND: ${GENERATION_BACKEND:-extractive}
      CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-recursive}
      CHUNK_SIZE: ${CHUNK_SIZE:-120}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-20}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      HF_HOME: /data/models
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-vie+eng}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-60}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-60}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-24000000}
    volumes:
      - app-data:/data
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      - qdrant
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  app-data:
  qdrant-data:
